<style>
:root{--ink:#063b19;--deep:#07571f;--green:#1ac813;--green2:#15aa10;--paper:#f7f8f4;--paper2:#edf1e9;--line:#d8ded3;--white:#fff;--text:#182019;--muted:#657067;--success:#1b7f35;--successTint:#e7f6e9;--radius:14px}
*{box-sizing:border-box} html,body{margin:0;padding:0} body{background:var(--paper);color:var(--text);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px} h1,h2,h3{font-family:'Archivo',sans-serif} button{font-family:inherit} .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--paper)} .mono{font-family:'IBM Plex Mono',monospace}
.topbar{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--green)} .brand{display:flex;align-items:center;gap:12px} .logo{width:44px;height:44px;background:#fff;object-fit:contain;padding:3px} .brand strong{display:block;font-family:'Archivo';font-size:15px} .brand span{display:block;font-family:'IBM Plex Mono';font-size:10px;color:rgba(255,255,255,.62);letter-spacing:1px;text-transform:uppercase;margin-top:3px} .role-chip{font-family:'IBM Plex Mono';font-size:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 9px}
main{padding:18px 16px 74px} .eyebrow{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--deep);display:flex;align-items:center;gap:8px;margin:4px 2px 10px} .eyebrow:before{content:'';width:16px;height:2px;background:var(--green)}
.proj-card,.detail-head,.scope-box,.tl-item{background:var(--white);border:1px solid var(--line)} .proj-card{padding:18px;cursor:pointer} .proj-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px} .proj-top h3{margin:0 0 5px;font-size:17px} .proj-top p{margin:0;color:var(--muted);font-size:12px;line-height:1.45} .status{background:var(--successTint);color:var(--success);font-family:'IBM Plex Mono';font-size:10px;padding:4px 8px;height:max-content} .progress-row{display:flex;align-items:center;gap:10px} .track{height:7px;background:var(--paper2);flex:1;overflow:hidden} .fill{height:100%;background:var(--green)} .pct{font-family:'Archivo';font-weight:800;font-size:14px;width:42px;text-align:right} .meta{display:flex;justify-content:space-between;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);margin-top:9px}
.back{display:flex;align-items:center;gap:7px;color:var(--deep);font-size:13px;font-weight:700;margin-bottom:14px;cursor:pointer} .detail-head{padding:18px;margin-bottom:14px} .detail-head h2{margin:0 0 5px;font-size:18px} .detail-head .sub{margin:0 0 14px;color:var(--muted);font-size:12.5px} .daycounter{display:flex;align-items:baseline;gap:6px} .daycounter .big{font-family:'Archivo';font-size:26px;font-weight:800} .daycounter .of{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px} .link-btn,.mini{border:1px solid var(--line);background:#fff;color:var(--deep);padding:8px 10px;font-family:'IBM Plex Mono';font-size:10.5px;font-weight:700;cursor:pointer} .link-btn:hover,.mini:hover{border-color:var(--green);color:var(--green2)} .scope-box{padding:15px;margin-bottom:14px} .scope-box h3{margin:0 0 10px;font-size:14px} .scope-box ul{margin:0;padding-left:18px} .scope-box li{font-size:12.5px;color:var(--muted);line-height:1.5;margin:5px 0}
.tl-item{margin-bottom:10px} .tl-head{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer} .tl-day{display:flex;align-items:center;gap:10px} .tl-num{width:42px;height:34px;background:var(--paper2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:9px;line-height:1.1} .tl-num b{font-family:'Archivo';font-size:12px} .tl-date{font-weight:700;font-size:13px} .tl-time{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);margin-top:3px} .badge{font-family:'IBM Plex Mono';font-size:9.5px;background:var(--successTint);color:var(--success);padding:3px 7px} .tl-body{display:none;padding:0 15px 15px} .tl-body.open{display:block} .activity-card{border:1px solid var(--line);background:#fbfcf9;padding:12px;margin-top:10px} .activity-title{font-family:'IBM Plex Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700} .activity-card p{font-size:13px;line-height:1.5;margin:7px 0} .photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px} .photo-row img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in} .report-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px} .danger{color:#a33;border-color:#e0bcbc}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:728px;width:calc(100% - 32px);background:var(--ink);color:#fff;border:none;padding:15px;font-family:'Archivo';font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(6,59,25,.26);z-index:30} .fab:hover{background:var(--deep)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:50;display:flex;align-items:flex-end;justify-content:center} .modal{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:20px 18px 100px} .modal-head{display:flex;justify-content:space-between;align-items:center} .modal-head h2{font-size:16px;margin:0} .close{width:31px;height:31px;border:0;background:var(--paper2);cursor:pointer} .modal-sub{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);margin:4px 0 16px} label.fl{display:block;font-family:'IBM Plex Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:7px} input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);padding:11px 12px;font:inherit;font-size:13px} textarea{min-height:88px;resize:vertical} .field{margin-bottom:16px} .activity-editor{border:1px solid var(--line);background:#fbfcf9;padding:12px;margin-bottom:12px} .editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px} .editor-head strong{font-family:'IBM Plex Mono';font-size:10.5px;text-transform:uppercase;color:var(--muted)} .remove-act{border:1px solid #e0bcbc;background:#fff;color:#a33;font-size:10px;padding:5px 8px;cursor:pointer} .source-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px} .source-btn{border:1px solid var(--line);background:var(--paper);padding:11px 8px;font-family:'Archivo';font-size:11.5px;font-weight:700;cursor:pointer} .source-btn:hover{border-color:var(--green);color:var(--green2)} .hidden-input{display:none} .thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px} .thumb{position:relative;width:62px;height:62px} .thumb img{width:100%;height:100%;object-fit:cover;border:1px solid var(--line)} .thumb button{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border:none;background:var(--ink);color:#fff;cursor:pointer} .add-act{width:100%;border:1px dashed var(--green2);background:#f4fff2;color:var(--deep);padding:11px;font-weight:700;cursor:pointer} .modal-footer{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;background:#fff;border-top:1px solid var(--line);padding:13px 18px;z-index:60} .primary{width:100%;border:none;background:var(--ink);color:#fff;padding:14px;font-family:'Archivo';font-weight:800;cursor:pointer} .primary:hover{background:var(--deep)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px} .lightbox img{max-width:95vw;max-height:88vh;object-fit:contain} .lbclose{position:fixed;right:18px;top:18px;width:42px;height:42px;background:rgba(0,0,0,.4);border:1px solid #777;color:#fff;font-size:20px;cursor:pointer} .empty{text-align:center;padding:34px;color:var(--muted);font-size:13px}
.pdf{background:#fff;color:#222;font-family:Arial;padding:28px;width:794px} .pdf h1,.pdf h2,.pdf h3{font-family:Arial} .pdf-header{border-bottom:4px solid var(--green);padding-bottom:12px;margin-bottom:18px} .pdf-logo{width:70px;height:70px;object-fit:contain} .pdf-act{page-break-inside:avoid;border-top:1px solid #ddd;padding-top:13px;margin-top:15px} .pdf-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px} .pdf-photos img{width:100%;height:225px;object-fit:cover;border:1px solid #ddd}
.participants-box{background:#fff;border:1px solid var(--line);padding:15px;margin-bottom:14px}.participants-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.participants-head h3{margin:0;font-size:14px}.participant-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;background:var(--paper2);border:1px solid var(--line);margin-top:7px}.participant-info b{display:block;font-size:12px}.participant-info span{font-family:'IBM Plex Mono';font-size:9.5px;color:var(--muted)}.participant-actions{display:flex;gap:5px}.attendance-box{border:1px solid var(--line);background:#fff;padding:10px;margin-top:10px}.attendance-box h4{margin:0 0 8px;font-size:12px}.attendance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 4px;border-top:1px solid #edf0eb;font-size:11.5px}.attendance-row:first-of-type{border-top:0}.attendance-name span{display:block;font-family:'IBM Plex Mono';font-size:9px;color:var(--muted);margin-top:2px}.attendance-check{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono';font-size:10px}.activity-date{font-family:'IBM Plex Mono';font-size:10px;color:var(--deep);margin-top:6px}.empty-small{font-size:11.5px;color:var(--muted);padding:8px 0}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.two-fields{grid-template-columns:1fr}}
@media(max-width:520px){.source-actions{grid-template-columns:1fr 1fr} .brand span{display:none}}

.module-progress{background:#fff;border:1px solid var(--line);padding:15px;margin-bottom:14px}.module-progress-top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}.module-progress h3{margin:0;font-size:14px}.module-progress .summary{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted)}.module-list{display:grid;gap:8px;margin-top:12px}.module-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;background:var(--paper2);border:1px solid var(--line);font-size:11.5px}.module-item.done{border-color:var(--green);background:rgba(42,196,64,.08)}.module-name{display:flex;align-items:center;gap:8px}.module-dot{width:9px;height:9px;border-radius:50%;background:#cfd6cf;flex:0 0 auto}.module-item.done .module-dot{background:var(--green)}.module-state{font-family:'IBM Plex Mono';font-size:9.5px;font-weight:700;color:var(--muted)}.module-item.done .module-state{color:var(--green2)}.module-tag{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono';font-size:9px;background:var(--paper2);border:1px solid var(--line);padding:4px 6px;margin-bottom:7px}.module-tag.done{border-color:var(--green);color:var(--green2);background:rgba(42,196,64,.08)}.check-row{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-top:7px}.check-row input{width:16px;height:16px;accent-color:var(--green)}

const SUPABASE_URL='https://rxpankihpzqhjcdekpes.supabase.co';
const SUPABASE_KEY='sb_publishable_-EJkmFugU8XeMNpJ0Ei4Ag_a43jCzSD';
const PROGRAM_ID='iicl';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let PROGRAM={id:PROGRAM_ID,name:'Preparación para Certificación IICL — Inspector Dry Van',client:'05TEAM · Seguimiento de actividades de Elvis Sernauque Gómez',scope:[]};
let MODULES=[];
let state={screen:'home',reports:[],participants:[],clientMode:false,clientToken:null};
let editors=[];

function esc(s=''){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function maxDay(){return state.reports.reduce((m,r)=>Math.max(m,Number(r.day)||0),0)}
function completedModules(){return new Set(MODULES.filter(m=>m.completed).map(m=>m.name))}
function progressPct(){return MODULES.length?Math.round((MODULES.filter(m=>m.completed).length/MODULES.length)*100):0}
function topbar(role){return `<div class="topbar"><div class="brand"><img src="${LOGO}" class="logo"><div><strong>05TEAM</strong><span>REPORTEADOR DE ACTIVIDADES</span></div></div><div class="role-chip">${role}</div></div>`}

async function boot(){
  try{
    const params=new URLSearchParams(location.search);
    const token=params.get('client');
    let q=db.from('programs').select('id,name,trainer,client_token').eq('id',PROGRAM_ID).single();
    const {data:p,error:pe}=await q;if(pe)throw pe;
    if(token && token!==p.client_token){document.getElementById('app').innerHTML='<div class="empty" style="padding-top:80px">Enlace de cliente no válido.</div>';return}
    PROGRAM.name=p.name; PROGRAM.client=`05TEAM · Seguimiento de actividades de ${p.trainer}`; state.clientToken=p.client_token;
    if(token){state.clientMode=true;state.screen='client'}
    await reloadData(); render();
  }catch(e){console.error(e);document.getElementById('app').innerHTML='<div class="empty" style="padding-top:80px">⚠ No se pudo conectar con Supabase. Revisa la configuración y vuelve a cargar la página.</div>'}
}

async function reloadData(){
  const [{data:mods,error:me},{data:reps,error:re},{data:parts,error:pe}]=await Promise.all([
    db.from('modules').select('id,module_number,name,completed,completed_at').eq('program_id',PROGRAM_ID).order('module_number'),
    db.from('reports').select('id,day,report_date,created_at,updated_at').eq('program_id',PROGRAM_ID).order('day'),
    db.from('participants').select('id,full_name,dni,created_at').eq('program_id',PROGRAM_ID).order('created_at')
  ]); if(me)throw me;if(re)throw re;if(pe)throw pe;
  MODULES=mods||[]; PROGRAM.scope=MODULES.map(m=>m.name); state.participants=parts||[];
  const ids=(reps||[]).map(r=>r.id); let acts=[],attendance=[];
  if(ids.length){const {data,error}=await db.from('activities').select('id,report_id,module_id,description,photos,module_completed,activity_date,created_at,updated_at').in('report_id',ids).order('created_at');if(error)throw error;acts=data||[]}
  const actIds=acts.map(a=>a.id);
  if(actIds.length){const {data,error}=await db.from('attendance').select('activity_id,participant_id,attended').in('activity_id',actIds);if(error)throw error;attendance=data||[]}
  state.reports=(reps||[]).map(r=>({...r,date:r.report_date,activities:acts.filter(a=>a.report_id===r.id).map(a=>{const m=MODULES.find(x=>x.id===a.module_id);return {id:a.id,text:a.description||'',photos:Array.isArray(a.photos)?a.photos:[],moduleId:a.module_id||'',module:m?.name||'',moduleCompleted:!!a.module_completed,activityDate:a.activity_date||'',attendance:Object.fromEntries(attendance.filter(x=>x.activity_id===a.id).map(x=>[x.participant_id,!!x.attended]))}})}));
}

function render(){document.getElementById('app').innerHTML=topbar(state.screen==='client'?'CLIENTE':'PANEL')+(state.screen==='home'?home():state.screen==='detail'?detail(false):detail(true));bind()}
function home(){let done=MODULES.filter(m=>m.completed).length,pc=progressPct();return `<main><div class="eyebrow">Programa activo</div><div class="proj-card" id="openProgram"><div class="proj-top"><div><h3>${esc(PROGRAM.name)}</h3><p>${esc(PROGRAM.client)}</p></div><span class="status">ACTIVO</span></div><div class="progress-row"><div class="track"><div class="fill" style="width:${pc}%"></div></div><div class="pct">${pc}%</div></div><div class="meta"><span>Día ${maxDay()||0}</span><span>${done} de ${MODULES.length} módulos completados</span></div></div></main>`}
function detail(client){let reps=[...state.reports].sort((a,b)=>a.day-b.day),doneSet=completedModules(),done=doneSet.size,pc=progressPct();return `<main><div class="back" id="back">← Volver</div><div class="top-actions">${client?'':`<button class="link-btn" id="clientView">👁 Vista cliente</button><button class="link-btn" id="copyClient">🔗 Copiar enlace cliente</button>`}<button class="link-btn" id="pdfAll">⬇ PDF acumulado</button></div><div class="detail-head"><h2>${esc(PROGRAM.name)}</h2><p class="sub">${esc(PROGRAM.client)}</p><div class="daycounter"><span class="big">Día ${maxDay()||0}</span><span class="of">Último día registrado</span></div></div>${participantsHTML(client)}<div class="module-progress"><div class="module-progress-top"><div><h3>Avance del programa</h3><div class="summary">${done} de ${MODULES.length} módulos completados</div></div><div class="pct">${pc}%</div></div><div class="progress-row"><div class="track"><div class="fill" style="width:${pc}%"></div></div></div><div class="module-list">${MODULES.map((m,i)=>`<div class="module-item ${m.completed?'done':''}"><div class="module-name"><span class="module-dot"></span><span>${i+1}. ${esc(m.name)}</span></div><span class="module-state">${m.completed?'COMPLETADO':'PENDIENTE'}</span></div>`).join('')}</div></div><div class="eyebrow">Reportes por día</div>${reps.length?reps.map(r=>reportHTML(r,client)).join(''):'<div class="empty">Todavía no hay reportes.</div>'}</main>${client?'':`<button class="fab" id="newReport">＋ Crear reporte</button>`}`}
function participantsHTML(client){return `<div class="participants-box"><div class="participants-head"><div><h3>Integrantes</h3><div class="summary">${state.participants.length} participante${state.participants.length===1?'':'s'} registrado${state.participants.length===1?'':'s'}</div></div>${client?'':`<button class="mini" id="addParticipant">＋ Agregar integrante</button>`}</div>${state.participants.length?state.participants.map(p=>`<div class="participant-row"><div class="participant-info"><b>${esc(p.full_name)}</b><span>DNI: ${esc(p.dni)}</span></div>${client?'':`<div class="participant-actions"><button class="mini editParticipant" data-id="${p.id}">Editar</button><button class="mini danger deleteParticipant" data-id="${p.id}">Eliminar</button></div>`}</div>`).join(''):`<div class="empty-small">Todavía no hay integrantes registrados.</div>`}</div>`}
function openParticipant(id=null){const p=state.participants.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="participantOverlay"><div class="modal"><div class="modal-head"><h2>${p?'Editar':'Agregar'} integrante</h2><button class="close" id="closeParticipant">×</button></div><p class="modal-sub">Registra los datos del participante de la capacitación.</p><div class="field"><label class="fl">Nombre completo</label><input type="text" id="participantName" value="${esc(p?.full_name||'')}" placeholder="Nombre y apellidos"></div><div class="field"><label class="fl">DNI</label><input type="text" id="participantDni" inputmode="numeric" maxlength="12" value="${esc(p?.dni||'')}" placeholder="DNI"></div></div><div class="modal-footer"><button class="primary" id="saveParticipant">Guardar integrante</button></div></div>`);document.getElementById('closeParticipant').onclick=()=>document.getElementById('participantOverlay').remove();document.getElementById('saveParticipant').onclick=()=>saveParticipant(id)}
async function saveParticipant(id=null){const name=document.getElementById('participantName').value.trim(),dni=document.getElementById('participantDni').value.trim();if(!name||!dni)return alert('Completa nombre y DNI.');const btn=document.getElementById('saveParticipant');btn.disabled=true;btn.textContent='Guardando...';try{let error;if(id)({error}=await db.from('participants').update({full_name:name,dni}).eq('id',id));else({error}=await db.from('participants').insert({program_id:PROGRAM_ID,full_name:name,dni}));if(error)throw error;await reloadData();document.getElementById('participantOverlay').remove();render()}catch(e){console.error(e);alert(e.code==='23505'?'Ese DNI ya está registrado.':'No se pudo guardar el integrante.');btn.disabled=false;btn.textContent='Guardar integrante'}}
async function deleteParticipant(id){if(!confirm('¿Eliminar este integrante? También se eliminarán sus registros de asistencia.'))return;const {error}=await db.from('participants').delete().eq('id',id);if(error)return alert('No se pudo eliminar.');await reloadData();render()}
function reportHTML(r,client){let photos=(r.activities||[]).reduce((n,a)=>n+(a.photos?.length||0),0);return `<div class="tl-item"><div class="tl-head" data-day="${r.day}"><div class="tl-day"><div class="tl-num"><span>DÍA</span><b>${r.day}</b></div><div><div class="tl-date">Día ${r.day}</div><div class="tl-time">${r.activities.length} actividad${r.activities.length===1?'':'es'} · ${photos} foto${photos===1?'':'s'}</div></div></div><span class="badge">REGISTRADO</span></div><div class="tl-body" id="body-${r.day}">${r.activities.map((a,i)=>`<div class="activity-card"><div class="activity-title">Actividad ${i+1}</div>${a.activityDate?`<div class="activity-date">📅 ${formatDate(a.activityDate)}</div>`:''}${a.module?`<div class="module-tag ${a.moduleCompleted?'done':''}">${a.moduleCompleted?'✓ ':''}${esc(a.module)}</div>`:''}<p>${esc(a.text)}</p>${state.participants.length?`<div class="attendance-box"><h4>Asistencia</h4>${state.participants.map(p=>`<div class="attendance-row"><div class="attendance-name"><b>${esc(p.full_name)}</b><span>DNI ${esc(p.dni)}</span></div><div class="attendance-check">${a.attendance?.[p.id]?'☑ ASISTIÓ':'☐ NO ASISTIÓ'}</div></div>`).join('')}</div>`:''}${a.photos?.length?`<div class="photo-row">${a.photos.map(p=>`<img src="${esc(p)}" class="zoom">`).join('')}</div>`:''}</div>`).join('')}<div class="report-actions"><button class="mini pdfDay" data-day="${r.day}">⬇ PDF del día</button>${client?'':`<button class="mini editDay" data-day="${r.day}">Editar</button><button class="mini danger deleteDay" data-day="${r.day}">Eliminar día</button>`}</div></div></div>`}
function formatDate(v){if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}

function bind(){
 document.getElementById('openProgram')?.addEventListener('click',()=>{state.screen='detail';render()});
 document.getElementById('back')?.addEventListener('click',()=>{if(state.clientMode){return}state.screen=state.screen==='client'?'detail':'home';render()});
 document.getElementById('clientView')?.addEventListener('click',()=>{state.screen='client';render()});
 document.getElementById('copyClient')?.addEventListener('click',copyClientLink);
 document.getElementById('addParticipant')?.addEventListener('click',()=>openParticipant());
 document.querySelectorAll('.editParticipant').forEach(x=>x.onclick=()=>openParticipant(x.dataset.id));
 document.querySelectorAll('.deleteParticipant').forEach(x=>x.onclick=()=>deleteParticipant(x.dataset.id));
 document.getElementById('newReport')?.addEventListener('click',()=>openReport());
 document.getElementById('pdfAll')?.addEventListener('click',()=>pdfExport());
 document.querySelectorAll('.tl-head').forEach(x=>x.onclick=()=>document.getElementById('body-'+x.dataset.day).classList.toggle('open'));
 document.querySelectorAll('.zoom').forEach(x=>x.onclick=()=>lightbox(x.src));
 document.querySelectorAll('.deleteDay').forEach(x=>x.onclick=async e=>{e.stopPropagation();let d=+x.dataset.day;if(confirm('¿Eliminar todo el reporte del Día '+d+'?'))await deleteDay(d)});
 document.querySelectorAll('.editDay').forEach(x=>x.onclick=e=>{e.stopPropagation();openReport(+x.dataset.day)});
 document.querySelectorAll('.pdfDay').forEach(x=>x.onclick=e=>{e.stopPropagation();pdfExport(+x.dataset.day)})
}
async function copyClientLink(){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('client',state.clientToken);await navigator.clipboard.writeText(u.toString());alert('Enlace del cliente copiado.')}

function openReport(day=null){let existing=state.reports.find(r=>r.day===day);editors=(existing?JSON.parse(JSON.stringify(existing.activities)):[{id:crypto.randomUUID(),text:'',photos:[],moduleId:'',module:'',moduleCompleted:false,activityDate:new Date().toISOString().slice(0,10),attendance:{}}]);editors.forEach(a=>{a.activityDate=a.activityDate||new Date().toISOString().slice(0,10);a.attendance=a.attendance||{}});let selectedDay=day||maxDay()+1;let upper=Math.max(selectedDay,maxDay()+10,30);let options=Array.from({length:upper},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===selectedDay?'selected':''}>Día ${d}</option>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><h2>${existing?'Editar':'Crear'} reporte</h2><button class="close" id="closeModal">×</button></div><p class="modal-sub">Registra la fecha, actividad, evidencias y asistencia de los integrantes.</p><div class="field"><label class="fl">Día</label><select id="daySelect">${options}</select></div><div id="editors"></div><button class="add-act" id="addAct">＋ Agregar otra actividad</button></div><div class="modal-footer"><button class="primary" id="saveReport">Guardar reporte</button></div></div>`);drawEditors();document.getElementById('closeModal').onclick=closeModal;document.getElementById('addAct').onclick=()=>{editors.push({id:crypto.randomUUID(),text:'',photos:[],moduleId:'',module:'',moduleCompleted:false,activityDate:new Date().toISOString().slice(0,10),attendance:{}});drawEditors()};document.getElementById('saveReport').onclick=()=>saveReport(day)}
function drawEditors(){let c=document.getElementById('editors');c.innerHTML=editors.map((a,i)=>`<div class="activity-editor"><div class="editor-head"><strong>Actividad ${i+1}</strong>${editors.length>1?`<button class="remove-act" data-i="${i}">Eliminar</button>`:''}</div><div class="field"><label class="fl">Fecha de la actividad</label><input type="date" class="activityDateInput" data-i="${i}" value="${esc(a.activityDate||'')}"></div><div class="field"><label class="fl">Módulo del programa</label><select class="moduleSelect" data-i="${i}"><option value="">Seleccionar módulo...</option>${MODULES.map(m=>`<option value="${m.id}" ${a.moduleId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select><label class="check-row"><input type="checkbox" class="moduleDone" data-i="${i}" ${a.moduleCompleted?'checked':''}> Marcar este módulo como completado con esta actividad</label></div><div class="field"><label class="fl">¿Qué se realizó?</label><textarea class="actText" data-i="${i}" placeholder="Describe lo realizado...">${esc(a.text)}</textarea></div><div class="attendance-box"><h4>Asistencia de integrantes</h4>${state.participants.length?state.participants.map(p=>`<div class="attendance-row"><div class="attendance-name"><b>${esc(p.full_name)}</b><span>DNI ${esc(p.dni)}</span></div><label class="attendance-check"><input type="checkbox" class="attCheck" data-i="${i}" data-pid="${p.id}" ${a.attendance?.[p.id]?'checked':''}> Asistió</label></div>`).join(''):`<div class="empty-small">Primero registra integrantes en el proyecto.</div>`}</div><div class="source-actions"><button class="source-btn camBtn" data-i="${i}">📷 Tomar foto</button><button class="source-btn fileBtn" data-i="${i}">⬆ Subir foto / archivo</button></div><input type="file" accept="image/*" capture="environment" class="hidden-input camInput" data-i="${i}"><input type="file" accept="image/*" multiple class="hidden-input fileInput" data-i="${i}"><div class="thumbs">${a.photos.map((p,j)=>`<div class="thumb"><img src="${esc(typeof p==='string'?p:p.preview)}"><button class="rmPhoto" data-i="${i}" data-j="${j}">×</button></div>`).join('')}</div></div>`).join('');c.querySelectorAll('.actText').forEach(t=>t.oninput=()=>editors[+t.dataset.i].text=t.value);c.querySelectorAll('.activityDateInput').forEach(x=>x.onchange=()=>editors[+x.dataset.i].activityDate=x.value);c.querySelectorAll('.attCheck').forEach(x=>x.onchange=()=>{let a=editors[+x.dataset.i];a.attendance=a.attendance||{};a.attendance[x.dataset.pid]=x.checked});c.querySelectorAll('.moduleSelect').forEach(x=>x.onchange=()=>{let i=+x.dataset.i;editors[i].moduleId=x.value;editors[i].module=MODULES.find(m=>m.id===x.value)?.name||'';if(!x.value)editors[i].moduleCompleted=false;drawEditors()});c.querySelectorAll('.moduleDone').forEach(x=>x.onchange=()=>editors[+x.dataset.i].moduleCompleted=!!x.checked);c.querySelectorAll('.remove-act').forEach(b=>b.onclick=()=>{editors.splice(+b.dataset.i,1);drawEditors()});c.querySelectorAll('.camBtn').forEach(b=>b.onclick=()=>c.querySelector(`.camInput[data-i="${b.dataset.i}"]`).click());c.querySelectorAll('.fileBtn').forEach(b=>b.onclick=()=>c.querySelector(`.fileInput[data-i="${b.dataset.i}"]`).click());c.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async()=>{let i=+inp.dataset.i;for(let f of inp.files){if(!f.type.startsWith('image/'))continue;editors[i].photos.push({file:f,preview:URL.createObjectURL(f)})}drawEditors()});c.querySelectorAll('.rmPhoto').forEach(b=>b.onclick=()=>{editors[+b.dataset.i].photos.splice(+b.dataset.j,1);drawEditors()})}

async function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,max=1600;if(w>max){h=Math.round(h*max/w);w=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error('No se pudo procesar la imagen'))},'image/jpeg',.78)};img.onerror=reject;img.src=url})}
async function uploadPhoto(photo,day){if(typeof photo==='string')return photo;const blob=await compressImage(photo.file);const path=`${PROGRAM_ID}/dia-${day}/${crypto.randomUUID()}.jpg`;const {error}=await db.storage.from('report-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return db.storage.from('report-photos').getPublicUrl(path).data.publicUrl}
function storagePathFromUrl(url){try{const u=new URL(url);const marker='/storage/v1/object/public/report-photos/';const i=u.pathname.indexOf(marker);return i>=0?decodeURIComponent(u.pathname.slice(i+marker.length)):null}catch{return null}}

async function saveReport(originalDay){
 const btn=document.getElementById('saveReport');btn.disabled=true;btn.textContent='Guardando...';
 try{
  let day=+document.getElementById('daySelect').value;
  editors.forEach((a,i)=>{a.text=document.querySelectorAll('.actText')[i]?.value||a.text;a.activityDate=document.querySelectorAll('.activityDateInput')[i]?.value||a.activityDate||'';a.moduleId=document.querySelectorAll('.moduleSelect')[i]?.value||'';a.module=MODULES.find(m=>m.id===a.moduleId)?.name||'';a.moduleCompleted=!!document.querySelectorAll('.moduleDone')[i]?.checked&&!!a.moduleId});
  editors=editors.filter(a=>a.text.trim()||a.photos.length||a.moduleId);if(!editors.length)throw new Error('Agrega al menos una actividad.');
  let report=state.reports.find(r=>r.day===originalDay)||null;
  if(report && originalDay!==day){const conflict=state.reports.find(r=>r.day===day);if(conflict)throw new Error('Ya existe un reporte para el Día '+day);const {error}=await db.from('reports').update({day,updated_at:new Date().toISOString()}).eq('id',report.id);if(error)throw error}
  if(!report){const {data,error}=await db.from('reports').insert({program_id:PROGRAM_ID,day,report_date:new Date().toISOString().slice(0,10)}).select().single();if(error)throw error;report=data}
  const old=state.reports.find(r=>r.id===report.id)?.activities||[];const oldUrls=old.flatMap(a=>a.photos||[]).filter(x=>typeof x==='string');
  const normalized=[];for(const a of editors){const photos=[];for(const p of a.photos)photos.push(await uploadPhoto(p,day));normalized.push({...a,id:crypto.randomUUID(),photos})}
  const newUrls=normalized.flatMap(a=>a.photos).filter(x=>typeof x==='string');const removed=oldUrls.filter(x=>!newUrls.includes(x)).map(storagePathFromUrl).filter(Boolean);
  const {error:de}=await db.from('activities').delete().eq('report_id',report.id);if(de)throw de;
  const rows=normalized.map(a=>({id:a.id,report_id:report.id,module_id:a.moduleId||null,description:a.text,photos:a.photos,module_completed:!!a.moduleCompleted,activity_date:a.activityDate||null}));const {error:ie}=await db.from('activities').insert(rows);if(ie)throw ie;
  const attRows=normalized.flatMap(a=>state.participants.map(p=>({activity_id:a.id,participant_id:p.id,attended:!!a.attendance?.[p.id]})));if(attRows.length){const {error:ae}=await db.from('attendance').insert(attRows);if(ae)throw ae}
  if(removed.length)await db.storage.from('report-photos').remove(removed);await recalcModules();await reloadData();closeModal();render();
 }catch(e){console.error(e);alert(e.message||'No se pudo guardar el reporte.');btn.disabled=false;btn.textContent='Guardar reporte'}
}
async function recalcModules(){
 const {data:rs,error:re}=await db.from('reports').select('id').eq('program_id',PROGRAM_ID);if(re)throw re;const ids=(rs||[]).map(x=>x.id);let acts=[];if(ids.length){const {data,error}=await db.from('activities').select('module_id,module_completed').in('report_id',ids);if(error)throw error;acts=data||[]}
 for(const m of MODULES){const done=acts.some(a=>a.module_id===m.id&&a.module_completed);const {error}=await db.from('modules').update({completed:done,completed_at:done?new Date().toISOString():null}).eq('id',m.id);if(error)throw error}
}
async function deleteDay(day){try{const r=state.reports.find(x=>x.day===day);if(!r)return;const paths=(r.activities||[]).flatMap(a=>a.photos||[]).map(storagePathFromUrl).filter(Boolean);const {error}=await db.from('reports').delete().eq('id',r.id);if(error)throw error;if(paths.length)await db.storage.from('report-photos').remove(paths);await recalcModules();await reloadData();render()}catch(e){console.error(e);alert('No se pudo eliminar el reporte.') }}
function closeModal(){document.getElementById('overlay')?.remove()}
function lightbox(src){document.body.insertAdjacentHTML('beforeend',`<div class="lightbox" id="lb"><button class="lbclose">×</button><img src="${esc(src)}"></div>`);document.querySelector('.lbclose').onclick=()=>document.getElementById('lb').remove();document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')e.currentTarget.remove()}}
async function waitImages(el){const imgs=[...el.querySelectorAll('img')];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})))}
async function pdfExport(day=null){let reps=day?state.reports.filter(r=>r.day===day):[...state.reports].sort((a,b)=>a.day-b.day),done=MODULES.filter(m=>m.completed).length,pc=progressPct();let el=document.createElement('div');el.className='pdf';el.innerHTML=`<div class="pdf-header"><img src="${LOGO}" class="pdf-logo"><h1>${esc(PROGRAM.name)}</h1><p>${esc(PROGRAM.client)}</p><p><b>Último día registrado:</b> Día ${maxDay()}</p><p><b>Avance del programa:</b> ${pc}% · ${done} de ${MODULES.length} módulos completados</p></div>${reps.map(r=>`<section><h2>Día ${r.day}</h2>${r.activities.map((a,i)=>`<div class="pdf-act"><h3>Actividad ${i+1}</h3>${a.activityDate?`<p><b>Fecha:</b> ${formatDate(a.activityDate)}</p>`:''}${a.module?`<p><b>Módulo:</b> ${esc(a.module)}${a.moduleCompleted?' · COMPLETADO':''}</p>`:''}<p>${esc(a.text)}</p>${state.participants.length?`<p><b>Asistencia:</b> ${state.participants.filter(p=>a.attendance?.[p.id]).map(p=>esc(p.full_name)).join(', ')||'Sin asistentes marcados'}</p>`:''}${a.photos.length?`<div class="pdf-photos">${a.photos.map(p=>`<img crossorigin="anonymous" src="${esc(p)}">`).join('')}</div>`:''}</div>`).join('')}</section>`).join('')}`;let host=document.createElement('div');host.style='position:fixed;left:-10000px;top:0;width:794px';host.appendChild(el);document.body.appendChild(host);try{if(document.fonts?.ready)await document.fonts.ready;await waitImages(el);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await html2pdf().set({margin:8,filename:day?`05TEAM-dia-${day}.pdf`:'05TEAM-reporte-acumulado.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save()}finally{host.remove()}}
boot();
</script></body></html>
